<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trường Trung cấp Bách Khoa Bình Dương | Tuyển sinh lớp 10 kết hợp học Trung cấp chính quy</title>
    <meta name="description" content="Trường Trung cấp Bách Khoa Bình Dương (BDP) – tuyển sinh lớp 10 kết hợp học Trung cấp chính quy tại Dĩ An. Hỗ trợ 100% học phí học nghề, cam kết 100% học sinh ra trường có việc làm." />
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Tải lại trang (F5) luôn về đầu trang: tắt khôi phục vị trí cuộn của trình duyệt và bỏ #mục khỏi địa chỉ.
      // Mở thẳng một địa chỉ có #mục (không phải reload) thì vẫn cuộn tới mục đó như bình thường.
      (function () {
        try {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
          if (nav && nav.type === 'reload' && location.hash) history.replaceState(null, '', location.pathname + location.search);
          window.scrollTo(0, 0);
        } catch (e) { /* bỏ qua */ }
      })();
    </script>
    <!-- CSS màn hình chờ để inline: phải có ngay từ khung hình đầu tiên, trước khi file CSS chính tải xong -->
    <style>
      .preloader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; background: #fff; text-align: center; font-family: 'Be Vietnam Pro', Arial, sans-serif; transition: opacity .4s ease, visibility .4s; }
      .preloader.is-hiding { opacity: 0; visibility: hidden; pointer-events: none; }
      .preloader-logo { width: 150px; height: 150px; object-fit: contain; animation: pl-fade-in .6s ease both; }
      .preloader-name { display: flex; flex-direction: column; gap: 4px; color: #0b4f9a; animation: pl-fade-in .6s .15s ease both; }
      .preloader-name strong { font-size: 18px; font-weight: 800; letter-spacing: .03em; }
      .preloader-name span { font-size: 13px; font-weight: 600; letter-spacing: .22em; color: #d62f35; }
      .preloader-dots { display: flex; gap: 12px; height: 22px; align-items: center; }
      .preloader-dots i { width: 14px; height: 14px; border-radius: 50%; animation: pl-bounce 1s ease-in-out infinite; }
      .preloader-dots i:nth-child(1) { background: #0b4f9a; }
      .preloader-dots i:nth-child(2) { background: #d62f35; animation-delay: .15s; }
      .preloader-dots i:nth-child(3) { background: #0cb4fc; animation-delay: .3s; }
      @keyframes pl-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-8px); opacity: 1; } }
      @keyframes pl-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .preloader, .preloader-logo, .preloader-name, .preloader-dots i { animation: none; transition-duration: .01s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Hiện ngay khi tải trang; React thay bằng component Preloader có cùng markup -->
      <div class="preloader" role="status" aria-live="polite" aria-label="Đang tải trang">
        <img class="preloader-logo" src="/img/logo.png" alt="Logo Trường Trung cấp Bách Khoa Bình Dương" width="150" height="150" />
        <div class="preloader-name"><strong>BÁCH KHOA BÌNH DƯƠNG</strong><span>BINH DUONG POLYTECHNIC</span></div>
        <div class="preloader-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
